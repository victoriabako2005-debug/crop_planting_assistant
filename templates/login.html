<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <p id="greeting" class="greeting"></p>

    <div class="greeting-block">
        <p id="greeting" class="greeting"></p>
        <p class="greeting-sub">Welcome to your Crop Planting Assistant 🌱</p>
    </div>

    <div class="reminder-card auth-card">
        <h3>🌾 Log in</h3>

        {% if error %}
        <p class="auth-error">{{ error }}</p>
        {% endif %}

        <form method="POST" class="auth-form">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>

            <button type="submit">Log in</button>
        </form>

        <p>New here? <a href="{{ url_for('register') }}">Create an account</a></p>
    </div>

</body>
</html>
